name: Claude issue triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The Claude app token is only issued when the triggering user has write access; issues and PRs
          # here come from outside users, so run with the job token. Safe only because this job's tools
          # and permissions are narrow (see allowedTools and the permissions block).
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_non_write_users: "*"
          prompt: |
            Triage issue #${{ github.event.issue.number }} in ${{ github.repository }}.
            1. Read it with `gh issue view`. Get labels with `gh label list`.
               Add fitting EXISTING labels with `gh issue edit --add-label` (never create or remove labels;
               issue templates may already have set some). Look for duplicates with `gh search issues`;
               if one is clearly the same, add the `duplicate` label and link it in a comment.
            2. Bug report without a savegame or the log attached: ask for them in one short comment. The log is
               akhenaten-log.txt (Windows %APPDATA%/Akhenaten, Linux ~/.local/share/Akhenaten). For install or
               startup problems also ask for akhenaten.cfg (data_directory; Windows %APPDATA%/akhenaten.cfg,
               Linux ~/.config/akhenaten/akhenaten.cfg). There is no akhenaten.ini.
            3. A common question (building, Pharaoh data files / install path, command-line options,
               mods, log location, savegame compatibility) whose answer is in README.md, CLAUDE.md,
               CONTRIBUTING.md or docs/wiki: post a short answer and cite the file.
            Otherwise do not comment. Never guess; never promise features or timelines.
            Reply in the language of the issue.
          claude_args: >-
            --model claude-sonnet-5-5 --max-turns 8
            --allowedTools "Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh label list:*),Bash(gh search issues:*),Read,Grep,Glob"
