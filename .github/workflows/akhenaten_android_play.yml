name: Akhenaten Build Android (Google Play)

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  bundle:
    name: release bundle
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - uses: actions/setup-java@v5
      with:
        java-version: 17
        distribution: temurin
    - name: update-workspace
      run: |
        sudo apt -qq update
        sudo apt install --yes cmake build-essential ninja-build
    - name: Build release bundle
      env:
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEYSTORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        cd android
        SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
        if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
          echo "Android SDK not found on runner"
          exit 1
        fi
        printf 'sdk.dir=%s\n' "$SDK_ROOT" > local.properties
        if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/upload.keystore"
        fi
        if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
          echo "::warning::ANDROID_KEYSTORE_PASSWORD is not set, the bundle is unsigned and Google Play will not accept it"
        fi
        bash ./gradlew bundleRelease --stacktrace
    - name: Upload release bundle
      uses: actions/upload-artifact@v6
      with:
        name: akhenaten-release-aab
        path: android/akhenaten/build/outputs/bundle/release/akhenaten-release.aab
        if-no-files-found: error
